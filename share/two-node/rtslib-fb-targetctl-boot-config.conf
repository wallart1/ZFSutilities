# systemd drop-in for rtslib-fb-targetctl.service
# Overrides ExecStart to use the boot-safe config (saveconfig-boot.json) which
# excludes encrypted backstores whose device nodes don't exist until keys are loaded.
#
# Without this, targetctl restore fails the ENTIRE target when any backstore device
# is missing — all LUNs on that target are lost, not just the encrypted ones.
#
# After the service starts with the boot config, ExecStartPost runs
# iscsi-add-encrypted-luns, which adds the encrypted LUNs back if their
# keys happen to be loaded at boot time (e.g. keylocation=file:// on a
# non-encrypted filesystem, or a separate key-loading unit). When keys
# are not loaded the helper skips silently: its conf entries name device
# nodes that do not exist yet, so nothing is added and nothing is
# re-saved. After keys are loaded manually post-boot, run
# iscsi-recover-encrypted-luns (see the Proxmox integration guide).
# The bash -c guard keeps the service startable when the deployed
# script is absent (a missing ExecStartPost binary would fail the unit).
#
# The boot config is auto-generated by safe-iscsi-save whenever the full config is saved.
# If saveconfig-boot.json doesn't exist yet, falls back to the default saveconfig.json.
#
# systemd, not bash, parses Exec lines first: a single $ is expanded
# against systemd's own (empty) environment before the script runs, so
# every dollar bash must see is escaped as $$.
#
# The [Unit] ordering below delays the restore until ZFS has imported
# the pools and created the zvol device nodes: USB enclosures can
# enumerate after zfs-import-cache.service has completed (observed on
# the 2026-10-27 11:46 boot), and targetctl restore needs the zvol
# nodes to exist. Units missing on a host are ignored by systemd.
#
# A second ExecStartPost runs export-iscsi-state --check after the
# encrypted-LUN helper: the live LUN topology is compared against the
# pool-resident state map and any drift lands in the boot journal as
# "post-restore verification FAILED". This is what the 2026-10-27
# incident lacked — a boot that restored 3 of 33 LUN mappings looked
# healthy. Expected on a normal boot while encrypted keys are not yet
# loaded: the map records the encrypted LUN mappings and live state
# does not, so the FAILED line appears until load-keys +
# iscsi-recover-encrypted-luns complete (the line's own guidance — do
# NOT save config until reconciled — is correct in that window). The
# wrapper never fails the unit: it captures the check's output, prints
# the OK line when live matches the map, stays silent when the check
# exits 0 with no output (single-node mode), and re-emits the check's
# DRIFT/FATAL detail lines beneath the FAILED line. timeout(1) bounds
# a wedged targetcli so the ExecStartPost can neither hang nor fail
# the service.
#
# Install to: /etc/systemd/system/rtslib-fb-targetctl.service.d/boot-config.conf

[Unit]
After=zfs-import-cache.service zfs-import.target zfs-volume.service
Wants=zfs-import.target

[Service]
ExecStart=
ExecStart=/bin/bash -c 'boot=/etc/rtslib-fb-target/saveconfig-boot.json; if [ -f "$$boot" ]; then echo "targetctl: restoring boot config (encrypted backstores excluded)"; /usr/bin/targetctl restore "$$boot"; else echo "targetctl: boot config not found, using default"; /usr/bin/targetctl restore; fi'
ExecStartPost=/bin/bash -c 'if [ -x /usr/local/lib/zfsutilities/bin/iscsi-add-encrypted-luns ]; then exec /usr/local/lib/zfsutilities/bin/iscsi-add-encrypted-luns; else echo "targetctl: iscsi-add-encrypted-luns not present; skipping encrypted-LUN restore"; fi'
ExecStartPost=/bin/bash -c 'if [ ! -x /usr/local/lib/zfsutilities/bin/export-iscsi-state ]; then echo "targetctl: export-iscsi-state not present; skipping post-restore verification"; exit 0; fi; out=$$(timeout 120 /usr/local/lib/zfsutilities/bin/export-iscsi-state --check 2>&1); rc=$$?; if [ "$$rc" -eq 0 ]; then if [ -n "$$out" ]; then echo "targetctl: post-restore verification OK — live LUNs match the pool map"; fi; else echo "targetctl: post-restore verification FAILED — live LUNs differ from the pool map; do NOT save config until reconciled"; printf "%s\n" "$$out"; fi; exit 0'
