# systemd drop-in for rtslib-fb-targetctl.service
# Overrides ExecStart to use the boot-safe config (saveconfig-boot.json) which
# excludes encrypted backstores whose device nodes don't exist until keys are loaded.
#
# Without this, targetctl restore fails the ENTIRE target when any backstore device
# is missing — all LUNs on that target are lost, not just the encrypted ones.
#
# After the service starts with the boot config, ExecStartPost runs
# iscsi-add-encrypted-luns, which adds the encrypted LUNs back if their
# keys happen to be loaded at boot time (e.g. keylocation=file:// on a
# non-encrypted filesystem, or a separate key-loading unit). When keys
# are not loaded the helper skips silently: its conf entries name device
# nodes that do not exist yet, so nothing is added and nothing is
# re-saved. After keys are loaded manually post-boot, run
# iscsi-recover-encrypted-luns (see the Proxmox integration guide).
# The bash -c guard keeps the service startable when the deployed
# script is absent (a missing ExecStartPost binary would fail the unit).
#
# The boot config is auto-generated by safe-iscsi-save whenever the full config is saved.
# If saveconfig-boot.json doesn't exist yet, falls back to the default saveconfig.json.
#
# Install to: /etc/systemd/system/rtslib-fb-targetctl.service.d/boot-config.conf

[Service]
ExecStart=
ExecStart=/bin/bash -c 'boot=/etc/rtslib-fb-target/saveconfig-boot.json; if [ -f "$boot" ]; then echo "targetctl: restoring boot config (encrypted backstores excluded)"; /usr/bin/targetctl restore "$boot"; else echo "targetctl: boot config not found, using default"; /usr/bin/targetctl restore; fi'
ExecStartPost=/bin/bash -c 'if [ -x /usr/local/lib/zfsutilities/bin/iscsi-add-encrypted-luns ]; then exec /usr/local/lib/zfsutilities/bin/iscsi-add-encrypted-luns; else echo "targetctl: iscsi-add-encrypted-luns not present; skipping encrypted-LUN restore"; fi'
