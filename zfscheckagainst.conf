# zfscheckagainst.conf — Backup series table
#
# NOTE: This is an example configuration from the original deployment.
# Edit the source roots, destination roots, and labels below to match your
# own ZFS pools and backup topology.
#
# Each line defines one source→counterpart relationship to check before
# deleting a snapshot. The checkagainst script verifies the snapshot is not
# the last one in common with its counterpart dataset.
#
# Format (space-separated):
#   <source-root>  <destination-root>  <label>
#
# <source-root>       Source dataset tree whose snapshots are checked.
#                     May contain <offsite>; each occurrence is replaced with
#                     every offsite-candidate pool name at run-time.
# <destination-root>  Destination dataset tree where the counterpart snapshot
#                     is expected. May contain <offsite>.
# <label>             Snapshot label to match (e.g. dailybackup, offsite).
#
# The counterpart dataset is constructed by replacing the source-root prefix
# of the snapshot's dataset with the destination-root prefix.
#
# Backup series covered:
#  1)  dailybackup   threeamigos          <---->  fivebays/threeamigos
#  2)  dailybackup   NVME1                <---->  fivebays/NVME1
#  3)  dailybackup   temp                 <---->  z22tb/temp
#  4)  dailybackup   temp                 <---->  z40tb/temp
#  5)  offsite       temp                 <---->  z22tb/temp
#  6)  offsite       temp                 <---->  z40tb/temp
#  7)  offsite       threeamigos          <---->  fivebays/threeamigos
#  8)  offsite       NVME1                <---->  fivebays/NVME1
#  9)  offsite       fivebays             <---->  z22tb/fivebays
# 10)  offsite       fivebays             <---->  z40tb/fivebays

threeamigos          fivebays/threeamigos    dailybackup
NVME1                fivebays/NVME1          dailybackup
fivebays/threeamigos threeamigos             dailybackup
fivebays/NVME1       NVME1                   dailybackup
temp                 z22tb/temp              dailybackup
temp                 z40tb/temp              dailybackup
z22tb/temp           temp                    dailybackup
z40tb/temp           temp                    dailybackup
NVME1                fivebays/NVME1          offsite
threeamigos          fivebays/threeamigos    offsite
temp                 z22tb/temp              offsite
temp                 z40tb/temp              offsite
z22tb/temp           temp                    offsite
z40tb/temp           temp                    offsite
fivebays/threeamigos threeamigos             offsite
fivebays/NVME1       NVME1                   offsite
fivebays             z22tb/fivebays          offsite
fivebays             z40tb/fivebays          offsite
z22tb/fivebays       fivebays                offsite
z40tb/fivebays       fivebays                offsite
